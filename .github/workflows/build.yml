name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Build claude-desktop
        run: nix build .#claude-desktop --print-build-logs

      # A GUI Electron app has no meaningful headless smoke test; check instead
      # that autoPatchelfHook left no unresolved libraries in the main binary.
      - name: Check binary is fully patched
        run: |
          ldd ./result/lib/claude-desktop/claude-desktop
          ! ldd ./result/lib/claude-desktop/claude-desktop | grep -q "not found"
