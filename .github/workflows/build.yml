name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      # Skipped on pull requests from forks, where secrets are unavailable.
      - uses: cachix/cachix-action@v17
        if: github.ref == 'refs/heads/main'
        with:
          name: claude-desktop-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build claude-desktop
        run: nix build .#claude-desktop --print-build-logs

      # Do not use ldd here: on a non-NixOS runner it resolves against the host
      # glibc instead of the store's, which reports bogus failures. Unresolved
      # libraries already fail the build in autoPatchelfHook; running the
      # wrapper uses the store interpreter and checks the app actually starts.
      #
      # --no-sandbox is required only on the runner: GitHub's images restrict
      # unprivileged user namespaces via AppArmor, so the namespace sandbox the
      # wrapper normally selects is unavailable and Chromium aborts. NixOS
      # leaves security.allowUserNamespaces on, so the shipped default is fine.
      - name: Smoke test
        run: |
          EXPECTED=$(sed -n 's/^  version = "\([^"]*\)";.*/\1/p' package.nix | head -1)
          ACTUAL=$(./result/bin/claude-desktop --no-sandbox --version)
          echo "expected: $EXPECTED, got: $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]

      - name: Push to Cachix
        if: github.ref == 'refs/heads/main'
        run: nix build .#claude-desktop --json | jq -r '.[].outputs.out' | cachix push claude-desktop-nix
